plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.t527.awaiasr_2'
    compileSdk 36

    defaultConfig {
        applicationId "com.t527.sttperftest" // PERF-TEST-CHANGE: rename for play_sequence.py --stop-app + 실전 앱과 공존
        minSdk 33
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        ndk {
            abiFilters 'arm64-v8a'
        }
        
        externalNativeBuild {
            ndkBuild {
                arguments "NDK_APPLICATION_MK:=src/main/jni/Application.mk"
                abiFilters 'arm64-v8a'
            }
        }
    }
    
    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }
    
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packagingOptions {
        exclude 'lib/x86/*'
        exclude 'lib/x86_64/*'
        exclude 'lib/armeabi-v7a/*'
        exclude 'lib/arm64-v8a/libpytorch_jni_lite.so'
        pickFirst 'lib/arm64-v8a/libpytorch_jni.so'
        pickFirst 'lib/arm64-v8a/libfbjni.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.17.1'
    implementation('org.pytorch:pytorch_android:1.13.1') {
        exclude group: 'com.facebook.soloader', module: 'nativeloader'
    }
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
